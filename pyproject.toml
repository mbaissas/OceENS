[project]
name = "oceens"
version = "0.1.0"
description = "Course evaluation platform built for the EPF engineering school."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "sqlmodel==0.0.39",
    "SQLAlchemy==2.0.52",
    "uvicorn==0.52.4",
    "pydantic==2.13.4",
    "starlette==1.6.0",
    "python-dotenv==1.2.3",
    "requests==2.34.2",
    "msal==1.38.0",
    "openpyxl==3.1.5",
    "python-multipart==0.0.32",
    "Jinja2==3.1.6",
    "itsdangerous==2.2.0",
    "pandas==3.0.5",
    "requests-cache==1.3.3",
    "markdown-it-py==4.2.0",
]

[project.scripts]
oceens-summaries = "oceens.summaries_generator_daemon:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "tach~=0.35.0",
]
